defaults:
  #  - base_config
  - _self_
  - override hydra/launcher: joblib

benchmark_path: ${oc.env:BMH_BENCHMARK_PATH}
material_identifier: ???
optimization:
  objectives: ???
  population_size: 500
  offspring_size: 30
  max_evaluations: 1000000
  variable_count: 100
  precondition_population: false
  write_fronts: false
system:
  v_max: 1
plot_server: none
simulation:
  ppm3: 1
reference_front_file:

hydra:
  job:
    chdir: true
    config:
      override_dirname:
        # A path would create nested directories and the directory name is parsed by the funvar tools
        exclude_keys:
          - benchmark_path
  launcher:
    n_jobs: 8
  sweep:
    dir: multirun/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
